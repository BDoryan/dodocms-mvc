<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign Up - DodoCMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <form class="card shadow-sm">
                    <div class="card-body p-4">
                        <h1 class="h3 mb-4">Creer un compte</h1>
                        <div class="row g-3">
                            <div class="col-md-6"><label class="form-label" for="first-name">Prenom</label><input id="first-name" class="form-control" type="text"></div>
                            <div class="col-md-6"><label class="form-label" for="last-name">Nom</label><input id="last-name" class="form-control" type="text"></div>
                            <div class="col-12"><label class="form-label" for="signup-email">Email</label><input id="signup-email" class="form-control" type="email"></div>
                            <div class="col-12"><label class="form-label" for="signup-password">Mot de passe</label><input id="signup-password" class="form-control" type="password"></div>
                        </div>
                        <button class="btn btn-primary mt-4" type="submit">S'inscrire</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>
</body>
</html>
