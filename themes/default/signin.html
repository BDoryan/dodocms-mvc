<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In - DodoCMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <form class="card shadow-sm">
                    <div class="card-body p-4">
                        <h1 class="h3 mb-4">Connexion</h1>
                        <div class="mb-3"><label class="form-label" for="signin-email">Email</label><input id="signin-email" class="form-control" type="email"></div>
                        <div class="mb-3"><label class="form-label" for="signin-password">Mot de passe</label><input id="signin-password" class="form-control" type="password"></div>
                        <button class="btn btn-primary w-100" type="submit">Se connecter</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>
</body>
</html>
